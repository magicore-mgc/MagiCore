# block-buffer 0.10.4 is unreachable in MagiCore's hashing path: SHA-2 resolves
# through sha2 0.11.1 -> block-buffer 0.12.1, and 0.10.4 arrives only via
# digest 0.10.7 from sqlx/termwiz. No patched 0.10.x exists. Mirrors the
# deny.toml bans skip so the two scanners cannot disagree.
# (block-buffer 0.10.4 không reachable trong đường hash của MagiCore: SHA-2 đi
# qua sha2 0.11.1 -> block-buffer 0.12.1, còn 0.10.4 chỉ đến từ digest 0.10.7
# của sqlx/termwiz. Dòng 0.10.x không có bản vá. Khớp với skip trong deny.toml
# để hai scanner không lệch nhau.)
