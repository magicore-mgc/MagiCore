name: Release Binary E2E

# P0-3 (Tech Lead 2026-09-11): a release RC must be proven by running
# the ACTUAL distributed binary — build the release archive exactly as
# the release pipeline packs it, install it into a clean prefix (no
# cargo, no PATH from the repo), then drive the FULL product lifecycle
# with that installed binary: create → install → test → build → dev →
# audit. No #[ignore], no skip-marker passes: every step must exit 0 or
# the lane fails (required environment is provisioned by the workflow).
#
# P0 findings #3/#5/#6/#7 (2026-09-12) fixed here:
# - #3: the archive label now carries the REAL host triple (rustc -vV)
#   — a GNU build is never labeled musl, an arm64 macOS build is never
#   labeled x86_64. Mislabeled archives ship broken binaries to Alpine
#   users.
# - #5: Windows runner added — the release ships windows-x64, the E2E
#   must prove it there too.
# - #6: depth added — mgc test (not skipped), dev probe with a REAL
#   HTTP roundtrip + clean shutdown, mgc run, STRICT audit (exit 0/1
#   only — exit 2 "unverified" fails the lane), offline reinstall
#   proving cache hit (bytes-from-cache > 0 or MgCStore label), and
#   network-avoided evidence on the warm install.
# - #7: AI/Python and App/Flutter lanes run the installed binary
#   through their full lifecycle (release scope parity).
#
# P0-3: RC release phải được chứng minh bằng chính binary phân phối —
# đóng archive đúng format release pipeline, cài vào prefix sạch (không
# cargo, không PATH từ repo), rồi chạy trọn chuỗi lifecycle bằng binary
# đã cài: create → install → test → build → dev → audit. Không
# #[ignore], không skip-marker nào được tính pass: mọi bước phải exit 0
# thì lane mới xanh (môi trường bắt buộc do workflow provision).
# P0 findings #3/#5/#6/#7 đã sửa tại đây: nhãn archive mang host triple
# THẬT (GNU không bao giờ gắn nhãn musl, arm64 không gắn nhãn x86_64);
# thêm runner Windows; tăng chiều sâu (mgc test thật, dev probe HTTP
# thật + tắt sạch, mgc run, audit strict exit 0/1, offline reinstall
# chứng minh cache hit, warm install tránh mạng); thêm lane AI/Python
# và App/Flutter chạy binary đã cài qua full lifecycle (parity release
# scope).

on:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - ".github/workflows/release-binary-e2e.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-*.yml"
      - "scripts/release/**"
  push:
    branches: [main, "fix/**"]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - ".github/workflows/release-binary-e2e.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-*.yml"
      - "scripts/release/**"
  workflow_dispatch:

permissions:
  contents: read

# Replace superseded validation runs on the same ref. — Hủy lượt kiểm cũ khi ref có lượt mới.
concurrency:
  group: release-binary-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The native MGC audit lanes require a reachable OSV API; they do not
  # depend on cargo-audit or pip-audit executables.
  # Lane audit native của MGC cần OSV API; không phụ thuộc binary
  # cargo-audit hay pip-audit.
  MGC_E2E_AUDIT_NETWORK: required

jobs:
  release-archive-lifecycle:
    name: release archive lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Swift 6.4 on Windows requires the VS 2022 toolchain and Windows SDK.
        # Swift 6.4 trên Windows yêu cầu bộ công cụ VS 2022 và Windows SDK.
        os: [ubuntu-24.04, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Node.js (web lane deps)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"

      - name: Setup Python (AI lane runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"

      # esbuild-rs build script compiles a Go library — Go is required
      # on every OS (CI workflow already does this; P0-8 lesson).
      # Build script của esbuild-rs compile thư viện Go — Go bắt buộc
      # trên mọi OS (workflow CI đã làm; bài học P0-8).
      - name: Setup Go (esbuild-rs build dep)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      # --- Build the release binary + pack the EXACT release layout ---
      - name: Build release binary
        run: cargo build --release --bin mgc --locked

      # P0 finding #3 fix: the archive label is the REAL host triple
      # from rustc -vV. Building without --target means host-native
      # (GNU on Linux, NOT musl) — labeling that archive "musl" ships
      # a broken binary to Alpine users. arm64 macOS runners must not
      # be labeled x86_64 either.
      # P0 finding #3: nhãn archive là host triple THẬT từ rustc -vV.
      # Build không --target nghĩa là host-native (GNU trên Linux,
      # KHÔNG phải musl) — gắn nhãn "musl" cho nó là phát hành binary
      # hỏng tới user Alpine. Runner macOS arm64 cũng không được gắn
      # nhãn x86_64.
      - name: Resolve host triple (rustc -vV — the truth)
        shell: bash
        run: |
          HOST_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ -z "$HOST_TRIPLE" ]]; then
            echo "rustc -vV returned no host triple" >&2
            exit 1
          fi
          echo "HOST_TRIPLE=$HOST_TRIPLE" >> "$GITHUB_ENV"
          echo "host triple: $HOST_TRIPLE"

      - name: Pack release archive (release pipeline layout)
        shell: bash
        run: bash scripts/release/binary_e2e/archive/pack_release_archive.sh

      # --- Install into a CLEAN prefix (no repo PATH leakage) ---
      - name: Install binary into clean prefix
        shell: bash
        run: bash scripts/release/binary_e2e/archive/install_clean_prefix.sh

      - name: Export installed mgc to PATH
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$HOME/.magicore-test/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.magicore-test/bin" >> "$GITHUB_PATH"
          fi

      # P0 finding #6: web lane now runs the DEEP lifecycle — mgc test
      # for real, dev probe with an actual HTTP roundtrip + clean
      # shutdown, mgc run, STRICT audit (exit 2 unverified FAILS), and
      # warm offline reinstall proving the cache was hit.
      # P0 finding #6: lane web giờ chạy lifecycle SÂU — mgc test thật,
      # dev probe có HTTP roundtrip thật + tắt sạch, mgc run, audit
      # STRICT (exit 2 unverified thì FAIL), warm offline reinstall
      # chứng minh cache được hit.
      - name: Lifecycle web (create → install → test → build → dev probe → run → audit → offline reinstall)
        shell: bash
        run: bash scripts/release/binary_e2e/web/web_lifecycle.sh

      - name: Lifecycle lib rust (create → install → test → build → strict audit)
        shell: bash
        run: bash scripts/release/binary_e2e/lifecycle/lib_rust.sh

      # AI/Python release lane uses the MGC-owned PyPI graph and mgc.lock.
      # Python is the system runtime; pytest/build/setuptools are MGC-managed
      # project packages imported from its verified store.
      # Lane AI/Python dùng graph PyPI và mgc.lock do MGC sở hữu.
      - name: Lifecycle ai python (native add → install → test → build → strict audit)
        shell: bash
        run: bash scripts/release/binary_e2e/lifecycle/ai_python.sh

      # App/Flutter lane uses the installed binary on all three OS. The Windows
      # runner is pinned to VS 2022 for Swift's required Windows SDK; `flutter
      # test` still runs natively, and the `web` build target stays universal.
      # Lane App/Flutter dùng binary đã cài trên cả ba OS. Runner Windows
      # ghim VS 2022 theo Windows SDK Swift yêu cầu; `flutter test` vẫn chạy
      # native và target `web` vẫn phổ quát.
      - name: Install Linux build deps (flutter lane)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter (app lane)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: "stable"

      - name: Resolve Flutter SDK dependencies before MGC process guard
        shell: bash
        run: bash scripts/install/bootstrap_flutter_sdk.sh

      - name: Setup Swift installer Python (Windows)
        if: matrix.os == 'windows-2022'
        id: swift_python_310
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Verify Swift Python 3.10 executable (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          MGC_SWIFT_PYTHON_PATH: ${{ steps.swift_python_310.outputs.python-path }}
        run: |
          $pythonPath = $env:MGC_SWIFT_PYTHON_PATH
          if ([string]::IsNullOrWhiteSpace($pythonPath) -or !(Test-Path -LiteralPath $pythonPath -PathType Leaf)) { throw "setup-python did not return an existing Python executable" }
          $version = & $pythonPath --version
          if ($version -notmatch '^Python 3\.10\.') { throw "Swift requires Python 3.10.x; found $version" }

      # Import official Swift keys and pin both expected signing fingerprints before verification.
      # Nạp khóa Swift chính thức và đối chiếu hai fingerprint ký dự kiến trước khi xác minh.
      - name: Import Swift.org signing keys (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/release/binary_e2e/toolchain/import_swift_signing_keys.sh

      # Pin SwiftPM to one current stable toolchain on POSIX runners.
      # Cố định SwiftPM ở một toolchain stable hiện hành trên runner POSIX.
      - name: Setup Swift toolchain (Ubuntu/macOS)
        if: runner.os != 'Windows'
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"

      # Install the official signed Swift 6.4.1 bundle; Windows Server 2022 has no WinGet.
      # Cài bundle Swift 6.4.1 chính thức có chữ ký; Windows Server 2022 không có WinGet.
      - name: Setup Swift toolchain (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: ./scripts/release/binary_e2e/toolchain/install_swift_windows.ps1

      - name: Lifecycle app swift (create → install → test → build)
        shell: bash
        run: bash scripts/release/binary_e2e/lifecycle/app_swift.sh

      # Restore Python 3.15.0 after Swift has finished using its pinned Python 3.10 runtime.
      # Khôi phục Python 3.15.0 sau khi Swift dùng xong runtime Python 3.10 đã ghim.
      - name: Restore Python runtime (AI lane)
        if: matrix.os == 'windows-2022'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"

      - name: Lifecycle app flutter (create → install → test → build)
        shell: bash
        run: bash scripts/release/binary_e2e/lifecycle/app_flutter.sh

      - name: Lifecycle lockfile import (bun.lock → mgc.lock → audit, migration path)
        shell: bash
        run: bash scripts/release/binary_e2e/lifecycle/lockfile_import.sh

      - name: Warm reinstall (cache reuse lane)
        shell: bash
        run: bash scripts/release/binary_e2e/lifecycle/warm_reinstall.sh

      - name: Shared store cross-project reuse proof (B-series)
        # B1 (2026-09-12): CARGO_HOME/PIP_CACHE_DIR/UV_CACHE_DIR point
        # INSIDE the mgc store — two rust projects sharing one dep must
        # NOT download it twice (project B's fetch grows the store by
        # <1MB of lock metadata; every dep byte served from the shared
        # store). Runs the REAL #[ignore] integration test with the
        # real cargo toolchain on this runner.
        # B1: CARGO_HOME/PIP_CACHE_DIR/UV_CACHE_DIR trỏ VÀO store mgc —
        # hai project rust cùng một dependency KHÔNG được tải hai lần
        # (fetch project B làm store tăng <1MB lock metadata; mọi byte
        # dep được phục vụ từ store chung). Chạy test integration
        # #[ignore] THẬT với cargo thật trên runner này.
        if: matrix.os != 'windows-2022'
        shell: bash
        run: cargo test -p mgc-lib-adapter --test shared_store_tests -- --ignored --nocapture

      - name: Install summary shows the shared-store cache label
        # The distributed binary must NAME its cache source ("shared mgc
        # store") — honest labeling end to end (B-series).
        # Binary phân phối phải NÊU TÊN nguồn cache ("shared mgc
        # store") — gắn nhãn trung thực đầu cuối (B-series).
        if: matrix.os != 'windows-2022'
        shell: bash
        run: bash scripts/release/binary_e2e/lifecycle/install_summary.sh
