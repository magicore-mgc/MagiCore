name: Release

# Supply-chain security measures (RC-3):
# - Actions pinned to commit SHA (not floating tags) ✅
# - Checksum files (.sha256) generated and published ✅
# - SBOM generation (CycloneDX JSON format) ✅
# - Artifact attestation (GitHub provenance) ✅
# - Scoped permissions (read default, write for publish only) ✅

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 1.1.0-rc.10)"
        required: true
        type: string

permissions:
  contents: read # Default: read-only; only publish job gets write

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_tag: ${{ steps.resolve.outputs.is_tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and context
        id: resolve
        # Keep dispatch input out of shell source to prevent interpolation attacks.
        # Không chèn input dispatch vào mã shell để ngăn tấn công nội suy.
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$RELEASE_VERSION_INPUT"
            IS_TAG="false"
            PUBLISH="false"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            IS_TAG="true"
            PUBLISH="true"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          CARGO_VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "Version mismatch: workflow=$VERSION Cargo.toml=$CARGO_VERSION"
            exit 1
          fi

          # One grouped redirect instead of three appends (SC2129).
          # (Một redirect nhóm thay vì ba lần append — SC2129.)
          {
            echo "version=$VERSION"
            echo "is_tag=$IS_TAG"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved version: $VERSION"
          echo "Is tag push: $IS_TAG"
          echo "Will publish: $PUBLISH"

  build-release:
    needs: resolve-version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  test-release-artifacts:
    needs: [resolve-version, build-release]
    uses: ./.github/workflows/release-artifact-smoke.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  pre-publish-verification:
    needs: [resolve-version, test-release-artifacts]
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/release-prepublish-verification.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  audit-capability-gate:
    needs: [resolve-version]
    permissions:
      contents: read
    uses: ./.github/workflows/release-audit-capability.yml

  release-scoped-support-evidence-gate:
    name: Release scoped framework and language evidence gate
    needs: [resolve-version]
    uses: ./.github/workflows/stress-matrix.yml

  release-lifecycle-evidence-gate:
    name: Release lifecycle and scaffold evidence gate
    needs: [resolve-version]
    uses: ./.github/workflows/lifecycle-matrix.yml

  release-source-ci-gate:
    name: Release workspace tests, lint, and packaging gate
    needs: [resolve-version]
    uses: ./.github/workflows/ci.yml

  publish-cli-container:
    needs: [resolve-version, pre-publish-verification, audit-capability-gate, release-scoped-support-evidence-gate, release-lifecycle-evidence-gate, release-source-ci-gate]
    if: ${{ always() && needs.resolve-version.outputs.publish == 'true' && needs.release-scoped-support-evidence-gate.result == 'success' && needs.pre-publish-verification.result == 'success' && needs.audit-capability-gate.result == 'success' && needs.release-lifecycle-evidence-gate.result == 'success' && needs.release-source-ci-gate.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-publish-container.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-release:
    needs: [resolve-version, pre-publish-verification, audit-capability-gate, release-scoped-support-evidence-gate, publish-cli-container, release-lifecycle-evidence-gate, release-source-ci-gate]
    if: ${{ always() && needs.resolve-version.outputs.publish == 'true' && needs.release-scoped-support-evidence-gate.result == 'success' && needs.pre-publish-verification.result == 'success' && needs.audit-capability-gate.result == 'success' && needs.publish-cli-container.result == 'success' && needs.release-lifecycle-evidence-gate.result == 'success' && needs.release-source-ci-gate.result == 'success' }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/release-publish-github.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      trust_roots: ${{ vars.MGC_RELEASE_TRUST_ROOTS }}
    secrets:
      MGC_RELEASE_SIGNING_KEY: ${{ secrets.MGC_RELEASE_SIGNING_KEY }}

  verify-public-download:
    needs: [resolve-version, publish-github-release]
    permissions:
      contents: write
    uses: ./.github/workflows/release-public-download-smoke.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  dry-run-summary:
    needs: [resolve-version, pre-publish-verification, release-lifecycle-evidence-gate, release-source-ci-gate]
    if: ${{ needs.resolve-version.outputs.publish == 'false' }}
    uses: ./.github/workflows/release-dry-run-summary.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
