name: CI

on:
  workflow_call:
  push:
    branches: [main, development, "feature/**", "fix/**"]
  pull_request:
    branches: [main, development]

# Replace superseded validation runs on the same ref. — Hủy lượt kiểm cũ khi ref có lượt mới.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage-manifest-contract:
    name: Coverage Manifest Contract
    runs-on: ubuntu-latest
    steps:
      # Installer integrity contract reads a pinned historical file with git show.
      # Hợp đồng integrity cần đọc file ở commit lịch sử bằng git show.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate CI, release, and action-pin contracts
        run: bash scripts/test/test_ci_workflow_contract.sh
      - name: Validate Phase 0 coverage schema, fixture, and anti-laundering rules
        run: |
          python3 -m json.tool ci/evidence/coverage-manifest.schema.json >/dev/null
          python3 scripts/test/test_coverage_manifest.py
          python3 scripts/test/validate_coverage_manifest.py
      - name: Validate observed coverage manifest
        # The observed manifest is generated evidence, so it must stay schema
        # valid and must never silently shrink to zero lanes.
        # Manifest quan sát là bằng chứng sinh tự động: phải hợp schema và
        # không được âm thầm rỗng.
        run: |
          python3 scripts/audit/emit_coverage_observed.py
          python3 scripts/test/test_coverage_observed.py
      - name: Keep Docker benchmark lifecycle attached to the MGC binary
        run: python3 tests/test_benchmark_container_contract.py

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Setup Python (Unix process-guard regression tests require python3)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Setup Go (esbuild-rs build script needs go on PATH)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (latest)
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: mgc-exec allowlist tests
        # These tests inspect the OS process table while launching synthetic tools; serialize their fixtures.
        # Test này đọc process table khi spawn tool giả lập; chạy tuần tự để không gán chéo fixture.
        run: cargo test -p mgc-exec --test test_run -- --test-threads=1 2>&1
        timeout-minutes: 2

  feature-matrix:
    name: Feature build (${{ matrix.features || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every core must build on its own, and the no-feature build must work.
        # Mỗi core phải build riêng được, và bản không bật feature nào cũng phải build.
        features: ["web", "game", "ai", "clo", "cicd", "iot", "app", "lib", "hardware", ""]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"
      - name: Setup Go (esbuild-rs build script needs go on PATH)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (latest)
      - name: Build one core (or no features)
        shell: bash
        run: |
          if [[ -z "${{ matrix.features }}" ]]; then
            cargo check -p mgc --no-default-features --locked
          else
            cargo check -p mgc --no-default-features --features "${{ matrix.features }}" --locked
          fi

  minimum-rust-version:
    name: Minimum supported Rust (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: 1.94.0
      - name: Setup Go (esbuild-rs build script needs go on PATH)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Check every workspace target at the declared MSRV
        run: cargo check --workspace --all-targets --locked

  docker-cli-smoke:
    name: Build and smoke-test CLI container (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flutter SDK for MGC Pub resolution
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: false
      - name: Build the CLI image from the locked workspace
        run: docker build --pull --tag magicore-cli-smoke .
      - name: Extract the tested MGC binary for SDK-aware host lock generation
        run: bash scripts/ci/docker/common/extract_cli_binary.sh

      - name: Verify the released entrypoint starts
        run: bash scripts/ci/docker/common/verify_entrypoint.sh

      - name: Build a project image with MagiCore lifecycle
        run: bash scripts/ci/docker/common/build_seeded_web_node.sh

      - name: Run the app and test its live endpoint through MagiCore
        run: bash scripts/ci/docker/common/run_seeded_web_node.sh

      - name: Scaffold and build a real web container through the MGC CLI
        run: bash scripts/ci/docker/web/scaffold_react_container.sh

      - name: Run and reach the CLI-scaffolded container
        run: bash scripts/ci/docker/web/run_react_container.sh

      - name: Scaffold an Express service through MGC and build its container
        run: bash scripts/ci/docker/web/scaffold_express_container.sh

      - name: Run the MGC-scaffolded Express container through Docker port mapping
        run: bash scripts/ci/docker/web/run_express_container.sh

      - name: Build and run the AI Python container with MGC-owned packages
        run: bash scripts/ci/docker/ai/build_python_container.sh

      - name: Build and run the CDK validation container through MGC
        run: bash scripts/ci/docker/cloud/build_cdk_container.sh

      - name: Build and run the Rust library container with MGC-owned packages
        run: bash scripts/ci/docker/lib/build_rust_container.sh

      - name: Build and run Go, Python, and TypeScript library containers through MGC
        run: bash scripts/ci/docker/lib/build_polyglot_containers.sh

      - name: Build and run the Flutter app container with MGC-owned Pub dependencies
        run: bash scripts/ci/docker/app/build_flutter_container.sh

      - name: Verify non-root writes in every generated container profile
        run: bash scripts/ci/docker/common/verify_non_root_writes.sh

      - name: Deploy the CLI-scaffolded image to Kubernetes with kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kind
      - name: Exercise the generated Kubernetes Deployment and Service
        run: bash scripts/ci/docker/kubernetes/deploy_and_probe_web.sh

  nix-package:
    name: Build and run the Nix package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix with flakes enabled
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the mgc package with the committed input lock
        run: |
          test -s flake.lock
          nix build --no-update-lock-file --no-write-lock-file --print-build-logs .#default
      - name: Smoke-test the Nix-installed CLI
        run: |
          ./result/bin/mgc --version
          ./result/bin/mgc --help

  dependency-ownership-audit:
    # Native ownership gate: any external dependency-lifecycle tool spawn
    # blocks CI, even when marked DELEGATED.
    # Cổng native ownership: mọi tool ngoài trong dependency lifecycle chặn
    # CI, kể cả khi có nhãn DELEGATED.
    name: Dependency Ownership Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency ownership audit negative controls
        run: python3 scripts/test/test_audit_dependency_delegation.py
      - name: Audit matrix source provenance tests
        run: python3 scripts/test/test_audit_capability_matrix.py
      - name: Audit dependency ownership (fail on any delegation)
        run: python3 scripts/audit/audit_dependency_delegation.py
      - name: Audit mutation-writer call manifest (fail on gateway bypass)
        run: python3 scripts/audit/audit_mutation_calls.py
      - name: Mutation-gate negative controls (fail if the gate is blind)
        run: python3 scripts/audit/audit_mutation_calls.py --self-test
      - name: Audit ledger stays gitignored (local-only)
        run: git check-ignore -q docs/specs/dependencyDelegationAudit.json

  windows-spawn-tests:
    name: Windows Spawn Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"

      - name: Setup Node.js (for spawn tests)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"

      - name: Setup Flutter (for .bat spawn tests)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: "stable"

      - name: Resolve Flutter SDK dependencies before MGC process guard
        shell: bash
        run: bash scripts/install/bootstrap_flutter_sdk.sh

      - name: Setup Go (esbuild-rs build script needs go on PATH)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Windows spawn tests
        shell: bash
        run: |
          echo "=== Windows Tool Resolution ==="
          where.exe node || echo "Node not found"
          where.exe flutter || echo "Flutter not found"
          where.exe gradle || echo "Gradle not found (expected)"
          where.exe swift || echo "Swift not found (expected)"
          echo ""

          echo "=== Running mgc-exec Windows Tests ==="
          cargo test -p mgc-exec --test windows_spawn_test --test multiplatform_tools_test --locked -- --nocapture
          # Verify all Windows inspector, authenticated probe and cwd contracts.
          # Kiểm mọi contract Windows của inspector, probe xác thực và cwd.
          cargo test -p mgc-exec --lib windows_ --locked -- --nocapture
          cargo test -p mgc-lockfile --test no_follow atomic_replace_handles_long_windows_paths --locked -- --nocapture
        timeout-minutes: 10
      - name: Native dependency ownership matrix (Windows)
        shell: bash
        run: cargo test -p mgc --test native_ownership_matrix_e2e --locked -- --test-threads=1
        timeout-minutes: 20
      - name: Verify authenticated npm version probe through the Node shim
        shell: bash
        run: cargo test -p mgc --test native_ownership_matrix_e2e framework_npm_version_probe_uses_mgc_shim_with_canonical_windows_cwd --locked -- --ignored --exact --test-threads=1 --nocapture
        timeout-minutes: 5
      - name: single-core web CLI surface
        run: cargo test -p mgc --no-default-features --features web test_single_core_create_alias_parses --quiet
      - name: Global CLI tool install, execute, recovery, and Windows PATH E2E
        shell: bash
        run: cargo test -p mgc --test global_tool_e2e --locked -- --ignored --exact platform::global_cli_install_update_list_and_remove_are_isolated_and_persistent --test-threads=1 --nocapture
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: module hygiene
        run: bash scripts/audit/check-module-hygiene.sh
      - name: no npm/npx/pnpm/yarn/bun (L94)
        run: bash scripts/audit/check-no-pm.sh
      - name: release hash updater syntax
        run: bash -n scripts/release/update-release-hashes.sh
      - name: package manifests syntax
        # Windows fix (2026-09-11): this job's default shell on Windows
        # is pwsh — `>/dev/null` is a bash-ism that pwsh misreads as the
        # path D:\dev\null. Force bash for the POSIX redirect syntax.
        # Fix Windows: shell mặc định của job này trên Windows là pwsh —
        # `>/dev/null` là cú pháp bash mà pwsh hiểu nhầm thành đường dẫn
        # D:\dev\null. Ép bash cho cú pháp redirect POSIX.
        shell: bash
        run: |
          ruby -c packaging/homebrew/magicore.rb
          ruby -c packaging/homebrew/magicore-web.rb
          python3 -m json.tool packaging/scoop/magicore.json >/dev/null
          python3 -m json.tool packaging/scoop/magicore-web.json >/dev/null
      - name: benchmark provenance
        run: python3 benchmark/scripts/verify_benchmark_provenance.py
      - name: benchmark command parity
        run: python3 benchmark/scripts/test_bench_v2.py
      - name: analyzer regression tests
        run: python3 benchmark/scripts/test_analyzer_strict.py
      - name: manifest updater integration tests
        run: bash scripts/release/test_manifest_updater.sh
      - name: internal specs stay ignored
        run: |
          git check-ignore -q docs/specs/magiCoreChangeLog.md
          git check-ignore -q docs/specs/preGitCICDHardening20260820.md

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"
      - name: Setup Node.js (global CLI tool E2E)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
      - name: Setup Python (Unix process-guard regression tests require python3)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Setup Go (esbuild-rs build script needs go on PATH)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (latest)
      - name: cargo test
        run: cargo test --workspace --locked --exclude mgc --exclude mgc-e2e -- --test-threads=4
      - name: Seed registry + cargo test (mgc + mgc-e2e, skip benchmarks)
        run: |
          ./target/debug/mgc-registry --host 127.0.0.1 --port 4315 --store-dir /tmp/mgc-reg-store >/tmp/mgc-reg.log 2>&1 &
          SRV=$!
          trap 'kill $SRV' EXIT
          registry_ready=0
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://127.0.0.1:4315/v2/; then
              registry_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$registry_ready" != 1 ]]; then
            echo "FAIL: isolated registry did not become ready" >&2
            exit 1
          fi
          # No embedded template archives remain in the product: scaffolds resolve
          # registry-published layers or fall back to the MGC-controlled online
          # initializer. Seed nothing from fixtures here — test-only template
          # fixtures must never stand in for product layers (R12). The registry
          # below serves npm metadata/package installs for the test run.
          # Không còn archive template nhúng trong sản phẩm: scaffold resolve
          # layer đã publish trên registry hoặc fallback về initializer online do
          # MGC kiểm soát. Không seed fixture test thay layer sản phẩm (R12).
          # Registry dưới đây phục vụ metadata/package npm cho lượt test.
          mkdir -p /tmp/mgc-empty-cache
          MGC_NPM_REGISTRY=http://127.0.0.1:4315 MGC_TEMPLATES_DIR=/tmp/mgc-empty-cache cargo test -p mgc -p mgc-e2e --locked -- --test-threads=4 --skip bench_

  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"
      - name: Setup Go (esbuild-rs build script needs go on PATH)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (latest)
      - name: cargo build --release
        run: cargo build --release --all-targets --locked

  test-with-runtimes:
    name: Test with Full Runtime Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"

      - name: Setup Go (esbuild-rs build script needs go on PATH)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Setup Python for lifecycle E2E
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Setup Node.js for global CLI lifecycle E2E
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (latest)

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Keep this matrix aligned with all-core lifecycle and Windows spawn CI.
          # Đồng bộ runtime với lifecycle all-core và Windows spawn CI.
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Resolve Flutter SDK dependencies before MGC process guard
        shell: bash
        run: bash scripts/install/bootstrap_flutter_sdk.sh

      - name: Build optimized mgc binary for lifecycle E2E
        run: cargo build --release --bin mgc --locked

      - name: Global CLI tool lifecycle E2E (Unix)
        if: runner.os != 'Windows'
        run: cargo test -p mgc --test global_tool_e2e --locked -- --include-ignored --test-threads=1 --nocapture
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Verify runtimes available
        run: |
          python3 --version
          node --version
          flutter --version
          flutter doctor -v
          go version || echo "Go not available"

      - name: Run native test-runner security E2E on release binary
        run: cargo test -p mgc --test test_runner_security --locked
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Verify CommonJS and ESM package entrypoints without registry access
        run: cargo test --locked -p mgc --lib node_launcher_preserves_commonjs_and_esm_entrypoint_semantics -- --ignored --test-threads=1

      - name: Run optimizer E2E on release binary (MUST PASS - no || true)
        run: cargo test -p mgc --test optimizer_lifecycle_e2e --locked -- --include-ignored --nocapture
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Run Web, App scaffold, and Lib lifecycle tests on release binary
        run: cargo test --locked -p mgc --test full_lifecycle_e2e -- --nocapture --test-threads=1
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Run Node-backed Web lifecycle test on release binary
        run: cargo test --locked -p mgc --test full_lifecycle_e2e test_web_full_lifecycle -- --ignored --exact --nocapture --test-threads=1
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Run AI lifecycle test with MGC-installed pytest on release binary
        run: cargo test --locked -p mgc --test full_lifecycle_e2e test_ai_full_lifecycle -- --ignored --exact --nocapture --test-threads=1
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Run cache stress tests (MUST PASS)
        run: cargo test -p mgc --test cache_stress_test --locked -- --nocapture

      - name: Run CLI surface tests (MUST PASS)
        run: cargo test -p mgc --test cli_surface_errors_test --locked -- --nocapture

      - name: Run install smoke tests (MUST PASS)
        run: cargo test -p mgc --test install_smoke_test --locked -- --nocapture

      - name: Summary
        if: always()
        run: |
          echo "=== Test Summary ==="
          echo "Runtimes provisioned: Python3, Node, Flutter; project dependencies are installed through MGC"
          echo "Full-core lifecycle and global-tool E2Es invoke the optimized release mgc binary"
          echo "Install smoke tests: structure verified"

  fault-matrix-portable:
    # Gate 11-D2 (2026-09-15) + P0-6 (Tech Lead 2026-09-15): the fault/stress
    # suites split by PORTABILITY, and Windows becomes a REQUIRED lane.
    # kill_injection_matrix / stress_shared_store_matrix /
    # install_process_race are platform-portable (the unix-only assertion
    # paths are already cfg-gated inside the suites — kill-injection asserts
    # SIGKILL details on unix and "did not exit cleanly" elsewhere), so they
    # gate ALL THREE hardened OSes with NO `|| true` and NO
    # continue-on-error.
    # (Gate 11-D2 + P0-6: các suite fault/stress tách theo TÍNH DI ĐỘNG,
    # Windows thành lane BẮT BUỘC. Ba suite trên chạy được mọi nền tảng
    # (đường assert unix-only đã cfg-gate sẵn trong suite), nên chúng gate
    # CẢ BA OS với NO `|| true` và KHÔNG continue-on-error.)
    name: Fault Matrix — portable (MUST PASS, 3 OS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"

      - name: Setup Go (esbuild-rs build script needs go on PATH)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build test binaries (compile errors fail here, loudly)
        run: cargo build -p mgc --tests --locked
        timeout-minutes: 45

      - name: kill injection matrix (MUST PASS — no || true)
        # Gate 11-B.2 failpoint handshake: SIGKILL at every install phase
        # must never corrupt the store; doctor --repair must end HEALTHY.
        # (Gate 11-B.2 handshake failpoint: SIGKILL tại mọi phase install
        # không được làm hỏng store; doctor --repair phải kết thúc HEALTHY.)
        run: cargo test -p mgc --test kill_injection_matrix --locked
        timeout-minutes: 30

      - name: stress shared store matrix (MUST PASS — no || true)
        run: cargo test -p mgc --test stress_shared_store_matrix --locked
        timeout-minutes: 20

      - name: install process race (MUST PASS — no || true)
        run: cargo test -p mgc --test install_process_race --locked
        timeout-minutes: 20

  fault-matrix-unix-only:
    # P0-6 (Tech Lead 2026-09-15): suites that are NOT (yet) portable stay
    # REQUIRED on ubuntu+macos. disk_fault_injection_e2e uses
    # std::os::unix::fs::PermissionsExt (permission fault injection);
    # stress_64_process_race stays here per the Tech Lead verdict (its 64
    # concurrent processes are unix-runner territory for now — no unix-only
    # API was found in it, it may graduate to the portable lane after a
    # Windows soak).
    # (P0-6: các suite chưa di động vẫn BẮT BUỘC trên ubuntu+macos.
    # disk_fault_injection_e2e dùng PermissionsExt (unix-only);
    # stress_64_process_race ở lại theo phán quyết Tech Lead — không tìm
    # thấy unix-only API trong nó, có thể chuyển lên lane portable sau khi
    # ngâm Windows đủ lâu.)
    name: Fault Matrix — unix-only (MUST PASS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"

      - name: Setup Go (esbuild-rs build script needs go on PATH)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build test binaries (compile errors fail here, loudly)
        run: cargo build -p mgc --tests --locked
        timeout-minutes: 45

      - name: 64-process stress race (MUST PASS — no || true)
        run: cargo test -p mgc --test stress_64_process_race --locked
        timeout-minutes: 25

      - name: disk fault injection e2e (MUST PASS — no || true)
        run: cargo test -p mgc --test disk_fault_injection_e2e --locked
        timeout-minutes: 20
