name: Security

# Task #7: cargo audit + OSV scan (18 §6) — chạy theo lịch + khi Cargo.lock đổi
# Audit-e2e lane cũng chạy khi audit CODE đổi (Tech Lead P0-4 2026-09-09)
on:
  schedule:
    - cron: "0 0 * * 1" # thứ 2 hằng tuần
  pull_request:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "core/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/security.yml"
      - "osv-scanner.toml"
      - "adapters/**"
      - "cli/src/**"
      - "cli/tests/**"
      - "core/crates/**"
      - "scripts/dependency_delegation_audit/**"
      - "scripts/lifecycle_matrix/**"
      - "scripts/audit/audit_dependency_delegation.py"
      - "scripts/audit/lifecycle_capability_matrix.py"
      - "scripts/test/test_security_workflow_paths.py"
  push:
    paths:
      - "Cargo.lock"
      - "core/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/security.yml"
      - "osv-scanner.toml"
      - "adapters/**"
      - "cli/src/**"
      - "cli/tests/**"
      - "core/crates/**"
      - "scripts/dependency_delegation_audit/**"
      - "scripts/lifecycle_matrix/**"
      - "scripts/audit/audit_dependency_delegation.py"
      - "scripts/audit/lifecycle_capability_matrix.py"
      - "scripts/test/test_security_workflow_paths.py"
  workflow_dispatch:

# Replace superseded validation runs on the same ref. — Hủy lượt kiểm cũ khi ref có lượt mới.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup current Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"
      - name: Setup current Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Prove advisory-only RSA is unreachable
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree -i rsa --workspace --all-features --target all | grep -q '^rsa '; then
            echo "RUSTSEC-2023-0071 is reachable from the compiled workspace"
            exit 1
          fi
      - name: Run audit
        # The waiver list is single-sourced: this step reads the reviewed
        # [advisories] ignore entries from deny.toml, so `cargo audit` and
        # `cargo deny check` can never disagree.
        # (Danh sách waiver có một nguồn: bước này đọc các entry ignore đã
        # review trong deny.toml, nên `cargo audit` và `cargo deny check` không
        # bao giờ lệch nhau.)
        run: |
          set -euo pipefail
          args=()
          for id in $(python3 scripts/audit/audit_ignored_advisories.py .); do
            args+=(--ignore "$id")
          done
          echo "reviewed waivers: ${args[*]:-<none>}"
          cargo audit --color never "${args[@]}"
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.0 --locked
      - name: Enforce deny.toml policy
        # deny.toml existed but nothing ran it, so its bans/licenses/advisory
        # policy could silently rot. Gate every PR on it.
        # deny.toml tồn tại nhưng không ai chạy, nên policy bans/licenses/advisory
        # có thể mục âm thầm. Chặn mọi PR bằng nó.
        run: cargo deny check
      - name: Verify lockfile is reproducible
        run: cargo check --workspace --locked

  osv:
    name: OSV scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and Run OSV-Scanner
        run: |
          OSV_VERSION="2.6.0"
          OSV_URL="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          OSV_SHA="ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"

          # Download specific version with checksum
          # Tải phiên bản cố định kèm checksum
          curl -fsSL "$OSV_URL" -o /tmp/osv-scanner
          echo "${OSV_SHA}  /tmp/osv-scanner" | sha256sum --check
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner

          osv-scanner scan source -r . --config osv-scanner.toml

  audit-e2e:
    # Audit exit-contract proof lane (Tech Lead P0-5 2026-09-09): the
    # audit E2E suite must EXECUTE, never silently skip. Tools are
    # require live OSV reachability; missing external audit CLIs are not
    # part of the native Rust/Python scanner contract.
    # Lane chứng minh exit contract của audit: E2E phải CHẠY, không skip
    # âm thầm. Tool được provision sẵn; thiếu tool là fail cứng.
    name: audit E2E (strict contract)
    runs-on: ubuntu-latest
    env:
      MGC_E2E_AUDIT_NETWORK: required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup current Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"
      - name: Setup current Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Setup current Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Setup current Java runtime
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27.0.0+35"
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Install pip-audit (pinned, single install path — P0-5)
        run: |
          python3 -m pip install --user 'pip-audit==2.10.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install govulncheck (pinned — P1 Go lane)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install Gradle (pinned — Kotlin no-delegation sentinel)
        run: |
          GRADLE_VERSION="9.8.1"
          cd /tmp && curl -sSLO "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            && unzip -q "gradle-${GRADLE_VERSION}-bin.zip" \
            && echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH" \
            && gradle --version | head -5
      - name: Verify scanner versions (fail fast on drift)
        run: |
          cargo-audit --version
          pip-audit --version
          govulncheck -version 2>/dev/null | head -1 || true
          gradle --version | rg -i 'gradle' | head -2
      - name: Run audit CLI E2E (tools required — no silent skips)
        run: cargo test -p mgc --test audit_cli_e2e --locked -- --test-threads=1 --nocapture
      - name: Run Kotlin audit boundary tests (unsupported + no-delegation sentinel)
        run: cargo test -p mgc-app-adapter --test audit_tests audit_kotlin --locked -- --nocapture
      - name: Process-spawn audit (native engine — no rival runtime spawns)
        # Tech Lead #7 2026-09-10: CI proves mgc test/run/build/dev never
        # spawn bun/deno/npm outside the explicit compat gate.
        # CI chứng minh mgc test/run/build/dev không bao giờ spawn
        # bun/deno/npm ngoài cổng compat tường minh.
        run: cargo test -p mgc --test native_engine_spawn_audit --locked -- --nocapture
      - name: Test-runner security (scope enforcement + audit log)
        run: cargo test -p mgc --test test_runner_security --locked -- --nocapture
      - name: Generate capability matrix from E2E evidence
        run: python3 scripts/audit/audit_capability_matrix.py
      - name: Upload capability matrix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-capability-matrix
          path: docs/specs/auditCapabilityMatrix.json

  audit-e2e-cross-platform:
    # Cross-platform audit E2E (P2 2026-09-10, Tech Lead: "Windows/macOS/
    # Linux cùng SHA đều xanh"). Parser lanes are OS-independent by
    # design; this lane proves the EXEC layer (drain, hermetic PATH,
    # exit codes) on every runner. macOS/Windows carry no scanner
    # toolchain assumptions: their E2E asserts the honest
    # ToolMissing/exit-2 compatibility contract; no OSV network is required.
    # E2E audit đa nền tảng: lane parser bất độc lập OS; lane này chứng
    # minh tầng EXEC (drain, PATH hermetic, exit code) trên mọi runner.
    # macOS/Windows không cài scanner: E2E khẳng định hợp đồng
    # ToolMissing/exit-2 trung thực.
    name: audit E2E cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup current Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"
      # Go toolchain (CI fix 2026-09-11): esbuild-rs 0.13.8's build
      # script compiles a Go library at BUILD time — without Go the mgc
      # crate cannot compile on macOS/Windows runners (ubuntu ships Go
      # preinstalled, which is why only those lanes passed).
      # Go toolchain: build script của esbuild-rs 0.13.8 compile thư
      # viện Go ngay lúc BUILD — thiếu Go thì crate mgc không compile
      # được trên runner macOS/Windows (ubuntu có sẵn Go nên chỉ lane
      # đó pass).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Parser lanes (OS-independent)
        run: cargo test -p mgc-audit --locked -- --nocapture
      - name: OSV-backed lane E2E (Java/.NET/Swift/Dart — network, no toolchain)
        # These lanes hit the LIVE OSV API only — no gradle/dotnet/swift/
        # flutter toolchain needed. The runner proves lockfile parsing +
        # advisory mapping + exit codes on every OS. libtest takes ONE
        # substring filter per invocation — the four OSV lanes share no
        # common prefix, so they run as four exact invocations (CI fix
        # 2026-09-11: the previous `audit_` substring wrongly pulled
        # toolchain-dependent lanes into this toolchain-free job).
        # Lane OSV chỉ cần MẠNG — không cần toolchain gradle/dotnet/
        # swift/flutter. libtest nhận MỘT filter substring mỗi lần gọi —
        # bốn lane OSV không chung tiền tố nên chạy bốn lệnh exact
        # (fix CI: substring `audit_` trước đó kéo nhầm lane cần
        # toolchain vào job không-có-toolchain này).
        run: |
          cargo test -p mgc --test audit_cli_e2e --locked -- --test-threads=1 --exact audit_lib_java_via_cli_reports_real_osv_finding_exit_1
          cargo test -p mgc --test audit_cli_e2e --locked -- --test-threads=1 --exact audit_lib_dotnet_via_cli_reports_real_osv_finding_exit_1
          cargo test -p mgc --test audit_cli_e2e --locked -- --test-threads=1 --exact audit_app_swift_via_cli_reports_real_osv_findings_exit_1
          cargo test -p mgc --test audit_cli_e2e --locked -- --test-threads=1 --exact audit_app_flutter_via_cli_reports_real_osv_finding_exit_1
        env:
          MGC_E2E_AUDIT_NETWORK: required
      - name: Exec-layer E2E (hermetic contract)
        shell: bash
        run: cargo test -p mgc --test audit_cli_e2e --locked audit_lib_go_without -- --nocapture
      - name: Binary exit-contract E2E (unavailable → exit 2 strict)
        shell: bash
        run: cargo test -p mgc --test audit_cli_e2e --locked audit_unavailable -- --nocapture
      - name: Process-spawn audit (native engine contract on this OS)
        # The spawn-audit suite asserts refusals + canary silence — it
        # runs identically on every runner (no toolchain assumptions).
        # Suite spawn-audit khẳng định lời từ chối + canary im lặng —
        # chạy y hệt trên mọi runner (không cần toolchain).
        run: cargo test -p mgc --test native_engine_spawn_audit --locked -- --nocapture

  flutter-audit-toolchain:
    # A2 (2026-09-12): the app/flutter SECURITY audit runs via the
    # live OSV API (no CVE scanner ships inside the flutter toolchain
    # — dart/flutter have no `pub audit` command; OSV IS the real
    # scanner for pub.dev advisories). What was missing is the
    # TOOLCHAIN-DRIVEN lane: this job provisions flutter and proves
    # `mgc audit` drives the real `flutter pub outdated --json`
    # (dependency health, exit contract) and that the OSV security
    # lane resolves real pub advisories on the same SHA — the full
    # coverage row for the app/flutter security matrix.
    # A2: SECURITY audit app/flutter chạy qua OSV API trực tiếp (tool
    # chain flutter không có lệnh CVE scanner — OSV chính là scanner
    # thật cho advisory pub.dev). Điều thiếu là lane CHẠY TOOLCHAIN:
    # job này provision flutter và chứng minh `mgc audit` điều phối
    # `flutter pub outdated --json` THẬT (dependency health + exit
    # contract) và lane OSV resolve advisory pub thật trên cùng SHA —
    # dòng coverage đầy đủ cho matrix security app/flutter.
    name: flutter audit (real toolchain)
    runs-on: ubuntu-latest
    env:
      MGC_E2E_AUDIT_NETWORK: required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup current Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"

      - name: Setup current Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"

      - name: Setup current Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: "stable"

      - name: Resolve Flutter SDK dependencies before MGC process guard
        shell: bash
        run: bash scripts/install/bootstrap_flutter_sdk.sh

      - name: Install cargo-audit (rust parity lane on this SHA)
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Install pip-audit (python parity lane on this SHA)
        run: |
          python3 -m pip install --user 'pip-audit==2.10.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify scanner versions (fail fast on drift)
        run: |
          flutter --version | head -2
          cargo-audit --version
          pip-audit --version

      - name: Build mgc (real binary drives the audit)
        run: cargo build -p mgc --locked

      - name: App-adapter audit tests (flutter toolchain present)
        # The app adapter suite exercises the pub outdated parser with
        # the REAL flutter on PATH — no mock tool output.
        # Suite app adapter chạy parser pub outdated với flutter THẬT
        # trên PATH — không mock output tool.
        run: cargo test -p mgc-app-adapter --locked -- --nocapture

      - name: Flutter OSV security lane (real pub advisories, same SHA)
        run: cargo test -p mgc --test audit_cli_e2e --locked -- --test-threads=1 --exact audit_app_flutter_via_cli_reports_real_osv_finding_exit_1

      - name: Rust + python parity lanes (same SHA coverage row)
        run: |
          set -euo pipefail
          MGCBIN="${GITHUB_WORKSPACE}/target/debug/mgc"
          WORK="$(mktemp -d)"
          cd "$WORK"
          "$MGCBIN" create-lib rust lib-rs >/dev/null
          cd lib-rs
          "$MGCBIN" install
          export MGC_AUDIT_STRICT=1
          set +e
          "$MGCBIN" audit
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 1 ]]; then
            echo "rust audit exited $rc (0/1 allowed)" >&2
            exit 1
          fi
          echo "MARKER rust toolchain audit rc=$rc"
