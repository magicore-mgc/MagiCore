name: Lifecycle Capability Matrix

# P0-2 (Tech Lead 2026-09-11): the AUDIT capability matrix can never
# justify product "supported" claims — lifecycle is a SEPARATE
# dimensions including package operations (install/add/remove/update/list,
# frozen/offline, integrity, store/GC) and project lifecycle probes.
# with its own binary-driven evidence. This lane generates the
# lifecycle matrix on every PR touching product code and refuses to
# let lifecycle support regress silently. Java/.NET/Go scaffolds that
# fall back to another language are FAILED creates here (honest).
#
# The earlier six-lane RC gate is historical only. V1.2 evaluates the
# complete lane registry: release-blocking lanes require lifecycle evidence,
# and native-PM evidence is required only for MGC-native package claims.
# Named scope-outs remain visible with exact source-controlled reasons.
# (Gate sáu lane RC trước đây chỉ còn là lịch sử. V1.2 đánh giá toàn registry:
# lane chặn release cần lifecycle evidence; native-PM evidence chỉ bắt buộc
# với claim package MGC-native. Scope-out vẫn hiện cùng lý do từ source.)
#
# P0-2: matrix audit KHÔNG BAO GIỜ suy ra năng lực product — lifecycle
# là dimension RIÊNG với evidence binary riêng. Lane sinh matrix này
# mỗi PR chạm code product; scaffold java/.net/go rơi fallback ngôn ngữ
# khác sẽ là create FAILED (trung thực, không độn sự thật).
# Every release-blocking lane is evaluated against its own required dimensions;
# explicit scope-outs remain in the global inventory and cannot hide native claims.
# (Mỗi lane chặn release được đánh giá theo dimensions riêng; scope-out tường
# minh vẫn ở trong inventory toàn cục và không thể che giấu claim native.)
#
# Gate 11-C schema v7 (2026-09-29): framework-qualified lane identity plus
# per-required-dimension lifecycle owner evidence (wrapper success is not native),
# 23 dimensions × six-value status,
# plus clean-source-tree provenance required for every platform gate.
# vocabulary (native/managed/plain-delegation-pass, unverified,
# unsupported, failed). Gate 11-D: the SAME lifecycle and native-PM
# contract is enforced on Ubuntu, macOS, and Windows; each OS uploads
# its artifact for diagnosis and a failing platform blocks the workflow.
# (Gate 11-C schema v7: lane identity theo framework, owner từng lifecycle dimension,
# 23 dimension × bộ 6 trạng thái, kèm provenance
# source tree sạch bắt buộc cho mọi platform gate. Gate 11-D enforce
# cùng lifecycle và native-PM contract trên Ubuntu, macOS, Windows; mỗi
# OS tải artifact để chẩn đoán và platform lỗi sẽ làm workflow thất bại.)

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - "scripts/**"
      - "esp32-feature-e2e/**"
      - ".github/workflows/lifecycle-matrix.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-*.yml"
  push:
    branches: [main, "fix/**"]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - "scripts/**"
      - "esp32-feature-e2e/**"
      - ".github/workflows/lifecycle-matrix.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-*.yml"
  workflow_dispatch:

permissions:
  contents: read

# Replace superseded validation runs on the same ref. — Hủy lượt kiểm cũ khi ref có lượt mới.
concurrency:
  group: lifecycle-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lifecycle-matrix:
    name: lifecycle matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Swiftly-backed setup-swift v3 installs Swift 6.4 on Ubuntu 24.04.
        # setup-swift v3 dùng Swiftly để cài Swift 6.4 trên Ubuntu 24.04.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        include:
          # Windows runners resolve `python` (setup-python shims `python3`
          # unreliably across shells); POSIX runners keep `python3`.
          # (Runner Windows gọi `python` (shim `python3` không ổn định
          # giữa các shell); runner POSIX giữ `python3`.)
          - os: windows-latest
            python_cmd: python
          - os: ubuntu-24.04
            python_cmd: python3
          - os: macos-latest
            python_cmd: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1; toolchain pinned below
        with:
          toolchain: "1.99.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Python runtime (AI/Lib Python build and test)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"

      - name: Test native-PM verdict and matrix provenance guards
        run: ${{ matrix.python_cmd }} scripts/test_native_pm_verdict.py

      - name: Test binary-to-matrix ownership cross-check
        run: ${{ matrix.python_cmd }} scripts/test_dep_gate_consistency.py

      - name: Setup Node.js (web lane)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"

      - name: Setup Pulumi CLI (cloud lifecycle lane)
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: "3.268.0"

      - name: Setup Go (lib/go lane toolchain)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Setup Swift installer Python (Windows)
        if: matrix.os == 'windows-latest'
        id: swift_python_310
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Preserve Swift Python 3.10 runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          MGC_SWIFT_PYTHON_PATH: ${{ steps.swift_python_310.outputs.python-path }}
        run: ./scripts/ci/lifecycle/swift/preserve_python_windows.ps1
      # Import official Swift keys and pin both expected signing fingerprints before verification.
      # Nạp khóa Swift chính thức và đối chiếu hai fingerprint ký dự kiến trước khi xác minh.
      - name: Import Swift.org signing keys (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/toolchains/swift/import_signing_keys_linux.sh
      # Pin SwiftPM to one current stable toolchain on POSIX runners.
      # Cố định SwiftPM ở một toolchain stable hiện hành trên runner POSIX.
      - name: Setup Swift toolchain (Ubuntu/macOS)
        if: runner.os != 'Windows'
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"

      # Swift.org's Windows installer is distributed through WinGet.
      # Installer Windows của Swift.org được phân phối qua WinGet.
      - name: Setup Swift toolchain (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/ci/lifecycle/swift/install_windows.ps1
      # Restore the Python lane's pinned runtime after Swift's installer.
      # Khôi phục runtime Python của lane sau khi cài Swift.
      - name: Restore Python runtime (AI/Lib lanes)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"

      # App lane: flutter toolchain for create→install→test→build.
      # Lane App: toolchain flutter cho create→install→test→build.
      - name: Setup Flutter (app lane)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: "stable"

      # Resolve SDK-owned Pub packages before mgc-exec monitors app operations.
      # Giải quyết Pub thuộc SDK trước khi mgc-exec giám sát thao tác app.
      - name: Resolve Flutter SDK dependencies before MGC process guard
        shell: bash
        run: bash scripts/bootstrap_flutter_sdk.sh
        env:
          HOME: ${{ runner.temp }}/flutter-sdk-home
          USERPROFILE: ${{ runner.temp }}/flutter-sdk-home
          FLUTTER_SDK_HOME: ${{ runner.temp }}/flutter-sdk-home
          PUB_CACHE: ${{ runner.temp }}/flutter-pub-cache

      - name: Install Linux build deps (flutter lane)
        if: matrix.os == 'ubuntu-24.04'
        run: bash -e -o pipefail scripts/ci/lifecycle/app/install_linux_build_dependencies.sh
      - name: Build release mgc binary for product E2E
        run: cargo build --release --bin mgc --locked

      - name: Verify template fetch, cache, and integrity boundaries
        run: cargo test --release --locked -p mgc --lib commands::template::tests -- --test-threads=1

      - name: Verify versioned scaffold cache compatibility boundaries
        run: cargo test --release --locked -p mgc --lib scaffold::cache::tests -- --test-threads=1

      - name: Verify shared template materializer boundaries
        run: cargo test --release --locked -p mgc --lib scaffold::processor::tests -- --test-threads=1

      - name: Verify scaffold identity and all-core defaults through the release CLI
        run: cargo test --release --locked -p mgc --test scaffold_integration_test --test all_core_parity_test -- --test-threads=1

      - name: Verify persistent CLI tool lifecycle with the release binary
        run: cargo test --locked -p mgc --test global_tool_e2e -- --test-threads=1 --nocapture
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Verify global CLI tools are shared across project roots
        run: cargo test --locked -p mgc --test global_tool_e2e platform::different_projects_share_one_user_tool_root_without_removing_each_other -- --ignored --exact --test-threads=1 --nocapture
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Verify AI model audit with the release binary
        run: cargo test --locked -p mgc --test audit_cli_e2e audit_ai_cli_scans_checkpoint_weights_after_models_directory -- --exact --nocapture
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Verify core-marker attestation with the release binary
        run: cargo test --locked -p mgc --test core_identity_cli_e2e -- --test-threads=1 --nocapture
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Verify dlx lifecycle-script policy with the release binary
        run: cargo test --locked -p mgc --test dlx_e2e -- --include-ignored --test-threads=1 --nocapture
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc

      - name: Verify default-lane dev execution and project audit log
        shell: bash
        run: bash cli/tests/scripts/runtime_full_e2e.sh
        env:
          MGC_BIN: ./target/release/mgc

      - name: Verify Rust packages are reused across projects from the release binary
        run: cargo test --release --locked -p mgc --test native_ownership_matrix_e2e rust_lib_reuses_verified_shared_artifacts_across_project_roots -- --exact --test-threads=1 --nocapture
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc
        timeout-minutes: 10

      - name: Install ESP32-C3 RISC-V Rust target
        run: rustup target add riscv32imc-unknown-none-elf

      - name: Run live IoT install and product build E2E
        run: cargo test --locked -p mgc --test iot_native_install_e2e -- --ignored --exact install_iot_matches_cargo_lock_and_builds_esp32c3 --nocapture
        env:
          MGC_TEST_CLI_BINARY: ${{ github.workspace }}/target/release/mgc
        timeout-minutes: 20

      - name: Generate lifecycle matrix (real binary, real steps)
        # The script resolves the Windows binary (mgc.exe) itself, so the
        # POSIX-spelled MGC_LIFECYCLE_BIN works on every OS.
        # (Script tự quy về binary Windows (mgc.exe), nên MGC_LIFECYCLE_BIN
        # viết kiểu POSIX chạy trên mọi OS.)
        run: ${{ matrix.python_cmd }} scripts/lifecycle_capability_matrix.py
        env:
          MGC_LIFECYCLE_BIN: ./target/release/mgc
          MGC_LIFECYCLE_MATRIX_OUT: docs/specs/lifecycleCapabilityMatrix.json
          FLUTTER_SDK_HOME: ${{ runner.temp }}/flutter-sdk-home
          PUB_CACHE: ${{ runner.temp }}/flutter-pub-cache

      - name: Print per-lane verdicts into the log (evidence, incl. Windows)
        # Print every lane before the cross-platform gate for actionable CI logs.
        # In verdict từng lane trước gate đa nền tảng để log CI đủ thông tin xử lý.
        run: ${{ matrix.python_cmd }} scripts/lifecycle_matrix/ci/report_lane_verdicts.py

      - name: Upload lifecycle matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-capability-matrix-${{ runner.os }}
          path: docs/specs/lifecycleCapabilityMatrix.json

      - name: Enforce global v1.2 lifecycle and native-PM gate
        # Every declared lane stays in the matrix. Release-blocking lanes must
        # pass lifecycle evidence; native-PM evidence is required only for
        # MGC-native claims, including claims on scoped-out lanes. Scoped-out
        # lanes/frameworks remain visible with source-controlled reasons.
        # Missing or unknown required evidence still fails.
        # (Mọi lane đã khai vẫn nằm trong matrix. Lane chặn release phải qua
        # lifecycle. Claim MGC-native phải có native-PM evidence, kể cả khi
        # lane scope-out. Scope-out vẫn hiện cùng
        # lý do từ source; thiếu evidence bắt buộc hoặc không rõ vẫn fail.)
        run: ${{ matrix.python_cmd }} scripts/lifecycle_matrix/validation/release_gate/main.py
