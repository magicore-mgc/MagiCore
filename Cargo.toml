[workspace]
members = [
    "core/crates/*",
    "adapters/*",
    "cli",
    "tools/*",
    "tests/e2e",
]
exclude = ["tools/mgc-mcp"]
resolver = "2"

[workspace.package]
version = "1.1.0-rc.10"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/mingd-153/MagiCore"
authors = ["MagiCore Contributors"]

[workspace.dependencies]
# Internal crates
mgc-types = { path = "core/crates/mgc-types" }
mgc-audit = { path = "core/crates/mgc-audit" }
mgc-config = { path = "core/crates/mgc-config" }
mgc-crypto = { path = "core/crates/mgc-crypto" }
mgc-cache = { path = "core/crates/mgc-cache" }
mgc-http = { path = "core/crates/mgc-http" }
mgc-fetcher = { path = "core/crates/mgc-fetcher" }
mgc-lockfile = { path = "core/crates/mgc-lockfile" }
mgc-sbom = { path = "core/crates/mgc-sbom" }
mgc-resolver = { path = "core/crates/mgc-resolver" }
mgc-store = { path = "core/crates/mgc-store" }
mgc-ui = { path = "core/crates/mgc-ui" }
mgc-adapter-base = { path = "core/crates/mgc-adapter-base" }
mgc-platform = { path = "core/crates/mgc-platform" }
mgc-plugin = { path = "core/crates/mgc-plugin" }
mgc-search = { path = "core/crates/mgc-search" }
mgc-workspace = { path = "core/crates/mgc-workspace" }
mgc-pack = { path = "core/crates/mgc-pack" }
mgc-publish = { path = "core/crates/mgc-publish" }
mgc-oci = { path = "core/crates/mgc-oci" }
mgc-registry-server = { path = "core/crates/mgc-registry-server" }
mgc-oidc = { path = "core/crates/mgc-oidc" }
mgc-exec = { path = "core/crates/mgc-exec" }
# Shared ecosystem services (S07/S09, A05 single-owner): extracted from adapters.
mgc-js-service = { path = "core/crates/mgc-js-service" }
mgc-python-service = { path = "core/crates/mgc-python-service" }
which = "8.0.6"

# External deps (for mgc-http, mgc-oci, etc.)
http = { version = "1.5.0", features = [] }
bytes = { version = "1.12.1" }

# Unicode identifier rules used for Cargo-compatible generated names.
# Quy tắc Unicode identifier dùng cho tên Cargo được scaffold.
unicode-ident = "1.0.27"

# Async runtime
tokio = { version = "1.53.3", features = ["full"] }
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

# HTTP
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "gzip", "rustls", "http2", "multipart"] }
url = "2.5.8"
object_store = { version = "0.14.2", features = ["aws"] }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "compression-full"] }
notify = "8.2.0"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
toml = "1.1.8"
toml_edit = "0.25.17"
quick-xml = "0.42.0"
# Removed: bincode 1.3.3 has RUSTSEC-2025-0141, not actually used (mgc-store uses rmp-serde instead)
rmp-serde = "1.3.1"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
indicatif = "0.18.6"
console = "0.16.6"
colored = "3.1.1"
dialoguer = "0.12.0"
rand = { version = "0.10.3", features = ["std"] }

# TUI
ratatui = "0.30.2"  # 0.30.2: gets paste 1.0.16+ fix (RUSTSEC-2024-0436)
crossterm = "0.29.0"

# Crypto
sha2 = "0.11.1"
argon2 = { version = "0.6.0", features = ["zeroize"] }
blake3 = "1.8.7"
hex = "0.4.3"
base64 = "0.23.1"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"
futures-util = "0.3.34"
# WS test client (Gate 11 runtime evidence, vòng-11): pinned to the SAME
# 0.29 line tokio-tungstenite already occupies in Cargo.lock (a transitive
# of axum's ws feature) — the dev test client reuses the locked graph
# rather than adding a second WS stack.
# (WS client cho test (bằng chứng runtime Gate 11): ghim cùng dòng 0.29
# mà tokio-tungstenite đã chiếm trong Cargo.lock (transitive của feature
# ws của axum) — test client dùng lại graph đã lock thay vì thêm stack
# WS thứ hai.)
tokio-tungstenite = { version = "0.29.0", features = ["connect"] }
regex = "1.13.1"
libc = "0.2.190"

# Bundler (native Rust)
# Exact-pin (P0-3, Tech Lead vòng-6/7): the CLI resolves esbuild-rs from
# THIS workspace table — a range here lets `cargo update` silently drift
# the compiler identity away from the hardcoded COMPILER_VERSION const in
# cli/src/bundler/dev_server.rs (stale-cache poison after an update). The
# nested core/Cargo.toml carries the same pin for standalone-core builds.
# (Ghim chính xác (P0-3): CLI resolve esbuild-rs từ bảng workspace NÀY —
# range ở đây để `cargo update` kéo compiler trôi khỏi const
# COMPILER_VERSION hardcode trong dev_server.rs (độc stale-cache sau
# update). core/Cargo.toml lồng mang cùng pin cho build core độc lập.)
esbuild-rs = "=0.13.8"
glob = "0.3.4"
mime_guess = "2.0.5"

# Concurrency
dashmap = "6.2.1"
rayon = "1.12.0"
parking_lot = "0.12.5"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["async_tokio"] }
mockito = "1.7.2"

# Storage / files
# SQLx 0.9 uses libsqlite3-sys <0.38; rusqlite 0.40 needs 0.38 and Cargo
# forbids two versions with links = "sqlite3" in one graph. 0.39 is the newest
# rusqlite release compatible with that shared native SQLite link.
rusqlite = { version = "0.39.0", features = ["bundled"] }
walkdir = "2.5"
dirs = "7.0.0"
fs2 = "0.4.3"
lru = "0.18.5"
ignore = "0.4.33"
sha1 = "0.11.0"

# Compression
tar = "0.4.46"
flate2 = { version = "1.1.10", features = ["zlib"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
async-compression = { version = "0.4.50", features = ["tokio", "gzip"] }

# Utilities
semver = "1.0.28"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[workspace.lints.rust]
# deny (not forbid): edition 2024 makes env::set_var/remove_var unsafe; we gate
# every remaining unsafe block behind an item-level allow with a SAFETY proof.
# deny (không forbid): edition 2024 buộc env set/remove qua unsafe — mỗi block
# còn lại phải có #[allow] + giải trình SAFETY cụ thể, không allow toàn file.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# RULE §2/F06 requires same-name owner folders and implementation modules.
# RULE §2/F06 yêu cầu owner folder và module implementation cùng tên.
module_inception = "allow"

[profile.release]
opt-level = "z"          # Optimize for size
lto = "fat"              # Link-time optimization (aggressive)
codegen-units = 1        # Single codegen unit (better optimization)
strip = true             # Remove debug symbols (T5.4)
panic = "abort"          # Smaller binary (no unwind) (T5.4)

[profile.test]
opt-level = 1
debug = 0
incremental = false
