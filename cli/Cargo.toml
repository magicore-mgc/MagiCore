[package]
name = "mgc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MagiCore - Universal Package Manager CLI"
[lib]
name = "mgc"
path = "src/lib.rs"

[[bin]]
name = "mgc"
path = "src/main.rs"

[dependencies]
# Core crates
mgc-types = { workspace = true }
mgc-adapter-base = { workspace = true }
mgc-audit = { workspace = true }
mgc-config = { workspace = true }
mgc-resolver = { workspace = true }
mgc-store = { workspace = true }
mgc-lockfile = { workspace = true }
mgc-sbom = { workspace = true }
mgc-crypto = { workspace = true }
mgc-cache = { workspace = true }
mgc-fetcher = { workspace = true }
mgc-http = { workspace = true }
mgc-ui = { workspace = true }
mgc-pack = { workspace = true }
mgc-platform = { workspace = true }
mgc-publish = { workspace = true }
mgc-registry-server = { workspace = true }
sigstore-types = "0.15.0"
sigstore-verify = "0.15.0"
sigstore-trust-root = "0.15.0"
mgc-oidc = { workspace = true }
mgc-oci = { workspace = true }
mgc-exec = { workspace = true }
mgc-plugin = { workspace = true }
mgc-workspace = { workspace = true }

# Adapters (optional — per-core feature flags)
mgc-web-adapter = { path = "../adapters/web", optional = true }
mgc-lib-adapter = { path = "../adapters/lib", optional = true }
mgc-game-adapter = { path = "../adapters/game", optional = true }
mgc-iot-adapter = { path = "../adapters/iot", optional = true }
mgc-cloud-adapter = { path = "../adapters/cloud", optional = true }
mgc-app-adapter = { path = "../adapters/app", optional = true }
mgc-cicd-adapter = { path = "../adapters/cicd", optional = true }
mgc-ai-adapter = { path = "../adapters/ai", optional = true }
mgc-hardware-adapter = { path = "../adapters/hardware", optional = true }

# CLI
clap = { workspace = true }
clap_complete = { workspace = true }
semver = { workspace = true }

# Async
tokio = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
uuid = { workspace = true }

# HTTP
reqwest = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Compression
axum = { workspace = true }
tower-http = { workspace = true }

# Bundler
glob = { workspace = true }
# Removed: lightningcss not used, pulls rkyv 0.7.46 (RUSTSEC-2026-0235)
futures-util = { workspace = true }
walkdir = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
# PID liveness probe for the doctor's lease GC (Gate 11-B) — kill(pid,0).
# (Thăm dò pid còn sống cho GC lease của doctor.)
libc = { workspace = true }
fs2 = { workspace = true }

# Import rewriting + hashing
regex = { workspace = true }
blake3 = { workspace = true }

# Utilities
colored = { workspace = true }
dirs = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
crossterm = { workspace = true }
tempfile = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

# Feature flags per core — used for per-core binary builds
[features]
# Passthrough: the fault-matrix targets need the store/lockfile parking hooks,
# and a dev-dependency must NOT enable them (cargo resolver v1 unions features
# across the whole graph, so `mgc` was published with `mgc-store/fault-injection`
# on by default — a real `mgc install` could then hang on `MGC_FAILPOINT`).
# (Passthrough: dev-dependency KHÔNG được bật hook. Trên resolver v1 feature là
# union toàn graph nên `mgc` từng được publish với `mgc-store/fault-injection`
# bật mặc định — `mgc install` thật có thể treo vì `MGC_FAILPOINT`.)
fault-injection = ["mgc-store/fault-injection", "mgc-lockfile/fault-injection"]
default = ["all"]
all      = ["web", "game", "ai", "clo", "cicd", "iot", "app", "lib", "hardware"]
web      = ["mgc-web-adapter", "web-backend-runtime"]
web-backend-runtime = ["native-python-runtime"]
game     = ["mgc-game-adapter"]
ai       = ["mgc-ai-adapter", "native-python-runtime"]
clo      = ["mgc-cloud-adapter"]
cicd     = ["mgc-cicd-adapter"]
iot      = ["mgc-iot-adapter", "shared-language-adapter"]
app      = ["mgc-app-adapter"]
lib      = ["native-python-runtime"]
hardware = ["mgc-hardware-adapter"]
native-python-runtime = ["shared-language-adapter"]
shared-language-adapter = ["mgc-lib-adapter"]

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
reqwest = { workspace = true }
mockito = { workspace = true }
rand = { workspace = true }
# WS HMR evidence (Gate 11 runtime, vòng-11): real WebSocket handshake
# + update-event test for the dev server.
# (Bằng chứng WS HMR: test handshake WebSocket thật + nhận update-event
# cho dev server.)
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# Doctor-GC E2E (P2-1/P2-2, fresh-context review 2026-09-15): the race
# test plants hand-crafted crashed staging rows + holds the REAL
# ProjectInstallLock across a repair run — needs the store crate and
# raw rusqlite (same version as the workspace) for the surgery.
# (E2E GC doctor (P2-1/P2-2): test race cắm row staging đứt dựng tay +
# giữ ProjectInstallLock THẬT xuyên suốt lượt repair — cần crate store
# và rusqlite thô (cùng phiên bản workspace) cho phẫu thuật.)
mgc-store = { workspace = true }
rusqlite = { workspace = true }

[lints]
workspace = true

# Gate 11-D2 (2026-09-15): fault/stress integration targets declared
# EXPLICITLY so the CI fault-matrix job references real, reviewed targets —
# a deleted or renamed file makes `cargo test --test <name>` fail loudly
# instead of silently disappearing from auto-discovery.
# (Gate 11-D2: khai báo TƯỜNG MINH các target fault/stress để job
# fault-matrix trong CI tham chiếu target thật đã review — file bị xoá/
# đổi tên sẽ làm `cargo test --test <name>` fail ầm ĩ thay vì lặng lẽ
# biến mất khỏi auto-discovery.)
# The fault-matrix targets drive `MGC_FAILPOINT` (mgc-store) and
# `MGC_LOCK_FAILPOINT` (mgc-lockfile). Those hooks are compiled only with the
# `fault-injection` feature, so each target below requires it — a target that
# silently lost the feature would pass without ever injecting the fault.
# (Target fault-matrix dùng `MGC_FAILPOINT`/`MGC_LOCK_FAILPOINT`; hook chỉ tồn
# tại khi bật `fault-injection`, nên mỗi target dưới đây yêu cầu feature — target
# mất feature sẽ pass mà không hề inject lỗi.)
[[test]]
name = "kill_injection_matrix"
path = "tests/kill_injection_matrix.rs"
required-features = ["fault-injection"]

[[test]]
name = "stress_shared_store_matrix"
path = "tests/stress_shared_store_matrix.rs"

[[test]]
name = "install_process_race"
path = "tests/install_process_race.rs"

[[test]]
name = "stress_64_process_race"
path = "tests/stress_64_process_race.rs"

[[test]]
name = "disk_fault_injection_e2e"
path = "tests/disk_fault_injection_e2e.rs"

# Adapter-factory integration contracts (sources grouped under their owner).
# (Contract integration factory adapter, source được gom theo owner.)
[[test]]
name = "factory_project_binding"
path = "tests/factory/test/project_binding.rs"

[[test]]
name = "factory_explicit_plugin"
path = "tests/factory/test/explicit_plugin.rs"

[[test]]
name = "factory_available_cores"
path = "tests/factory/test/available_cores.rs"

# These suites also drive `MGC_FAILPOINT`; without the feature their fault
# assertions would run against a no-op hook and pass vacuously.
# (Các suite này cũng dùng `MGC_FAILPOINT`; thiếu feature thì assert lỗi chạy
# trên hook no-op và pass rỗng.)
[[test]]
name = "install_hardening_e2e"
path = "tests/install_hardening_e2e.rs"
required-features = ["fault-injection"]

[[test]]
name = "stress_suite"
path = "tests/stress_suite.rs"
required-features = ["fault-injection"]

# Guards user-facing messages against naming a command that does not exist.
# (Chặn message hướng dẫn nêu lệnh không tồn tại.)
[[test]]
name = "command_names_in_messages"
path = "tests/command_names_in_messages.rs"

# These suites inject a mutation fault to prove rollback. The hook is compiled
# only with `fault-injection`, so the target must require it — otherwise the test
# runs against a no-op and its "fault must be observable" assertion fails.
# (Các suite này inject lỗi mutation để chứng minh rollback; hook chỉ có khi bật
# `fault-injection`, nên target phải yêu cầu feature.)
[[test]]
name = "remove_journal_race"
path = "tests/remove_journal_race.rs"
required-features = ["fault-injection"]

[[test]]
name = "native_ownership_matrix_e2e"
path = "tests/native_ownership_matrix_e2e.rs"
required-features = ["fault-injection"]
