[package]
name = "mgc-search"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Multi-registry search engine for MagiCore - search packages across npm, crates.io, pkg.go.dev, PyPI"
rust-version.workspace = true
[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = "0.3.34"

# HTTP client
reqwest = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Cache storage
rusqlite = { workspace = true }

# Utilities
chrono = { workspace = true }
dirs = { workspace = true }
urlencoding = "2.1.3"

# MagiCore crates
mgc-types = { path = "../mgc-types" }
mgc-platform = { path = "../mgc-platform" }

[dev-dependencies]
mockito.workspace = true
tempfile = { workspace = true }

[[test]]
name = "types"
path = "tests/types.rs"

[[test]]
name = "client"
path = "tests/client.rs"

[[test]]
name = "orchestrator"
path = "tests/orchestrator.rs"

[[test]]
name = "ranking"
path = "tests/ranking.rs"

[[test]]
name = "cache"
path = "tests/cache.rs"

[lints]
workspace = true
