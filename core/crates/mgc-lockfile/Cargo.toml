[package]
name = "mgc-lockfile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cryptographically signed lockfile for Zero-Trust Supply Chain"
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Test modules tách riêng (RULE §5)
[[test]]
name = "schema"
path = "tests/schema.rs"

[[test]]
name = "schema_v3"
path = "tests/schema_v3.rs"

[[test]]
name = "tamper"
path = "tests/tamper.rs"

[[test]]
name = "migrate"
path = "tests/migrate.rs"

[[test]]
name = "import"
path = "tests/import.rs"

[[test]]
name = "v4_identity"
path = "tests/v4_identity.rs"

[[test]]
name = "v4_canonical"
path = "tests/v4_canonical.rs"

[[test]]
name = "v4_policy"
path = "tests/v4_policy.rs"

[[test]]
name = "v4_atomic"
path = "tests/v4_atomic.rs"

[[test]]
name = "v4_migrate"
path = "tests/v4_migrate.rs"

[[test]]
name = "v4_install_ready"
path = "tests/v4_install_ready.rs"

[[test]]
name = "v4_builder"
path = "tests/v4_builder.rs"

[[test]]
name = "v4_stress"
path = "tests/v4_stress.rs"

[[test]]
name = "v3_reproducibility"
path = "tests/v3_reproducibility.rs"

[[test]]
name = "lockfile_byte_proof"
path = "tests/lockfile_byte_proof.rs"

[dependencies]
# Crypto primitives (local crate)
mgc-crypto = { path = "../mgc-crypto" }
mgc-platform = { workspace = true }

# Shared JSONC cleanup + common types (P1 dedup 2026-09-11: single
# strip_jsonc for both the importer and the audit scanner).
# JSONC dùng chung + types chung (dedup P1: một strip_jsonc cho cả
# importer lẫn audit scanner).
mgc-types = { path = "../mgc-types" }

# TOML parsing/serialization
toml = { workspace = true }
toml_edit = { workspace = true, features = ["serde"] }

# Base64 for digest strings (workspace-pinned)
base64 = { workspace = true }
hex = { workspace = true }

# OS file locking for the project writer lock (V1.2 lock v4)
fs2 = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml.workspace = true

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Chrono for timestamps
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
# Deterministic crash points for the lock-publication crash-recovery harness.
# A default build must not be able to park on an environment variable.
# (Điểm crash xác định cho harness crash-recovery. Build mặc định không được
# phép dừng process theo biến môi trường.)
fault-injection = []

# PID liveness probes for stale-temp cleanup (unix-only)
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Windows lock-contention detection reads ERROR_LOCK_VIOLATION from windows-sys.
# Phát hiện tranh khoá trên Windows đọc ERROR_LOCK_VIOLATION từ windows-sys.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
