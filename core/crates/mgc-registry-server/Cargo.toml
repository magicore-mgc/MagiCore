[package]
name = "mgc-registry-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Private registry server (MagiCore) — binary: mgc-registry"
[[bin]]
name = "mgc-registry"
path = "src/main.rs"

[dependencies]
mgc-http = { workspace = true }
mgc-types = { workspace = true }
mgc-oci = { workspace = true }
mgc-config = { workspace = true }
mgc-store = { workspace = true }
mgc-lockfile = { workspace = true }
mgc-crypto = { workspace = true }
mgc-oidc = { workspace = true }
sigstore-sign = "0.15.0"
axum = { workspace = true }
tower-http = { workspace = true }
notify = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
object_store = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
clap = { workspace = true }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "uuid", "chrono", "json", "migrate"] }
chrono = { workspace = true }

[dev-dependencies]
http = { workspace = true }
tempfile = { workspace = true }
tokio-test = "0.4.6"
tower = "0.5.3"

[[test]]
name = "registry"
path = "tests/registry.rs"

[[test]]
name = "proxy_parse"
path = "tests/proxy_parse.rs"

[[test]]
name = "trusted_publishing"
path = "tests/trusted_publishing.rs"

[lints]
workspace = true
