[package]
name = "mgc-ai-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AI ecosystem adapter for MagiCore"
[dependencies]
anyhow.workspace = true
futures-util = { workspace = true }
mgc-audit = { workspace = true }
# Core crates (W1-W6 support)
mgc-types = { path = "../../core/crates/mgc-types" }
mgc-crypto = { workspace = true }
mgc-lockfile = { workspace = true }
mgc-sbom = { workspace = true }
mgc-cache = { workspace = true }
mgc-config = { workspace = true }
mgc-platform = { workspace = true }
mgc-adapter-base = { workspace = true }
# Shared Python service (S09b/D012): ownership predicate + manifest IO go
# straight here. (Service Python dùng chung: predicate + manifest IO.)
mgc-python-service = { workspace = true }
# KEPT (S09b partial retarget): resolve/prepare_add/fetch/install/list/age-gate
# still delegate to the embedded lib Python engine (`python_lane`), and
# `adapter_for_ai_python` still builds it with the ai security scope — drop
# deferred to the P04 wave moving the engine. (GIỮ: engine vẫn ở lib.)
mgc-lib-adapter = { path = "../lib" }

# Async
async-trait.workspace = true
tokio.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true

# Crypto
hex.workspace = true
sha2.workspace = true

# Utils
uuid.workspace = true

# HTTP
reqwest = { workspace = true, features = ["stream"] }

[dev-dependencies]
criterion = { workspace = true }
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "perf_bench"
harness = false

[[bench]]
name = "ai_bench"
harness = false

[lints]
workspace = true
